<meta name="theme-color" content="#eceef3" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<body data-game="riftbound">
<header class="topbar">
  <div class="topbar-inner">
    <h1 class="brand">Binder</h1>
    <nav class="games" id="games" aria-label="Jeu">
      <button type="button" data-game="riftbound" aria-pressed="true">Riftbound</button>
      <button type="button" data-game="yugioh" aria-pressed="false">Yu-Gi-Oh</button>
      <button type="button" data-game="pokemon" aria-pressed="false">Pokémon</button>
    </nav>
    <button type="button" class="gear" id="open-settings" data-tab="settings" aria-label="Réglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<div class="banner" id="banner" role="status" hidden></div>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button type="button" data-tab="home" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
    <span>Accueil</span>
  </button>
  <button type="button" data-tab="sets">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="18" height="6" rx="1.5"/></svg>
    <span>Sets</span>
  </button>
  <button type="button" data-tab="collection">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
    <span>Collection</span>
  </button>
  <button type="button" data-tab="binders">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M3 7h4M3 12h4M3 17h4"/><rect x="10" y="7" width="3.5" height="4.5" rx=".6"/><rect x="15" y="7" width="3" height="4.5" rx=".6"/><rect x="10" y="13.5" width="3.5" height="4.5" rx=".6"/><rect x="15" y="13.5" width="3" height="4.5" rx=".6"/></svg>
    <span>Binders</span>
  </button>
  <button type="button" data-tab="wishlist">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
    <span>Wishlist</span>
  </button>
</nav>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Fiche carte" hidden></section>
<input id="scan-input" type="file" accept="image/*" capture="environment" hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/store.js?v=__BUILD__"></script>
<script src="js/scan.js?v=__BUILD__"></script>
<script src="js/app.js?v=__BUILD__"></script>
</body>
</html>
