<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Classeur TCG</title>
<meta name="theme-color" content="#11141b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eceef3" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Classeur">
<meta name="build" content="__BUILD__">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="css/app.css?v=__BUILD__">
</head>
<body data-game="riftbound">
<header class="topbar">
  <div class="topbar-inner">
    <h1 class="brand">Classeur</h1>
    <nav class="games" id="games" aria-label="Jeu">
      <button type="button" data-game="riftbound" aria-pressed="true">Riftbound</button>
      <button type="button" data-game="yugioh" aria-pressed="false">Yu-Gi-Oh</button>
      <button type="button" data-game="pokemon" aria-pressed="false">Pokémon</button>
    </nav>
  </div>
</header>

<main id="view" class="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar" aria-label="Sections">
  <button type="button" data-tab="sets" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="9" rx="1.5"/><rect x="3" y="15" width="18" height="6" rx="1.5"/></svg>
    <span>Sets</span>
  </button>
  <button type="button" data-tab="collection">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
    <span>Collection</span>
  </button>
  <button type="button" data-tab="binders">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="15" height="18" rx="2"/><path d="M3 7h4M3 12h4M3 17h4"/><rect x="10" y="7" width="3.5" height="4.5" rx=".6"/><rect x="15" y="7" width="3" height="4.5" rx=".6"/><rect x="10" y="13.5" width="3.5" height="4.5" rx=".6"/><rect x="15" y="13.5" width="3" height="4.5" rx=".6"/></svg>
    <span>Classeurs</span>
  </button>
  <button type="button" data-tab="wishlist">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>
    <span>Wishlist</span>
  </button>
  <button type="button" data-tab="settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    <span>Réglages</span>
  </button>
</nav>

<div class="sheet-backdrop" id="backdrop" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Fiche carte" hidden></section>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="js/store.js?v=__BUILD__"></script>
<script src="js/app.js?v=__BUILD__"></script>
</body>
</html>
