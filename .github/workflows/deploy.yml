name: Mise à jour des cartes et publication

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # chaque nuit vers 4h-5h (heure de Luxembourg)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Copier l'app
        run: |
          mkdir -p _site
          cp -R app/. _site/
          # Numéro de version dans les liens CSS/JS : force le téléphone à charger le nouveau code.
          sed -i "s/__BUILD__/${{ github.run_number }}-${{ github.run_attempt }}/g" _site/index.html

      - name: Récupérer les catalogues de cartes
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          OUT_DIR: _site/data
        run: node scripts/build-data.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
